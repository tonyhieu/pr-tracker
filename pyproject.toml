[project]
name = "prt"
version = "0.1.0"
description = "Local tracker for PR plans and the status of each PR"
requires-python = ">=3.12"
dependencies = [
    "starlette",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
